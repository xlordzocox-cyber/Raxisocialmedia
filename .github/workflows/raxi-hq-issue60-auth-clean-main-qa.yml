name: Raxi HQ issue60 single-owner host clean-main consolidation
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raxi-hq-auth-main-consolidation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-qa:
    name: Full regression, inert Auth host, build and audit (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    defaults:
      run:
        working-directory: apps/raxi-hq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/raxi-hq/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --serial
      - run: npm run build
      - run: npm audit --audit-level=moderate
