name: Raxi HQ runtime Auth diagnostic UI QA (no deployment)
on:
  pull_request:
    branches:
      - feat/issue66-hq-command-center-shell
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raxi-runtime-auth-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-regression:
    name: Typecheck, read-only Auth UI tests, full test suite, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    defaults:
      run:
        working-directory: apps/raxi-hq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/raxi-hq/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test -- --serial
      - run: npm run build
      - run: npm audit --audit-level=moderate
